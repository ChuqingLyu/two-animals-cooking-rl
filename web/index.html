<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Q-Kitchen</title>
<link rel="preload" href="assets/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/zcool_kuaile.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script src="stage.js"></script>
</head>
<body>
<header>
  <h1><span data-t="title"></span><small class="titleSub" data-t="title_sub"></small></h1>
  <div id="progress"></div>
  <nav>
    <button data-go="menu" data-t="nav_menu"></button>
    <button id="musicBtn" title="Music on/off">♪</button>
    <button id="muteBtn" title="Sound on/off">🔊</button>
    <button id="langBtn">EN</button>
  </nav>
</header>
<main>
  <section id="menu" class="screen">
    <!-- home art: layered to match the opening video's last frame (16:9 box, cover-scaled like the video) -->
    <div id="homeStage" class="home-bg">
      <div class="homeBox">
        <img class="homeLogo" src="assets/home/title_logo.png" alt="">
        <canvas class="homeWendy" id="homeWendy" width="174" height="256" aria-label="Wendy"></canvas>
        <canvas class="homeKai" id="homeKai" width="219" height="256" aria-label="Kai"></canvas>
        <button id="homeStart" class="btn-primary" data-t="home_start"></button>
        <div id="homeDingoSlot"><figure id="menuDingo"><div class="bubble"><span data-t="menu_hi"></span></div><canvas id="menuDingoImg" width="358" height="410" aria-label="Dingo"></canvas></figure></div>
      </div>
    </div>
    <div class="menuStage">
      <div id="roadmap"></div>
    </div>
  </section>

  <section id="l0" class="screen">
    <div class="toolbar">
      <span class="hint" data-t="keys"></span>
      <button data-fs="l0wrap">⛶</button>
      <button id="l0teach" class="big hidden" data-t="l0_teach"></button>
      <button id="l0next" class="next" data-t="next" disabled></button>
    </div>
    <div id="l0steps" class="steps"></div>
    <div id="l0wrap" class="kwrap"><canvas id="c0" class="kcanvas" width="1280" height="720" tabindex="0"></canvas></div>
  </section>

  <section id="l1" class="screen">
    <div class="row">
      <canvas id="c1" width="320" height="320"></canvas>
      <div class="panel wide">
        <p class="hint" data-t="l1_hint"></p>
        <div id="l1steps" class="steps small"></div>
        <button id="l1train" class="big" data-t="train"></button> <span id="l1tries" class="small"></span>
        <p id="l1note" class="hint hidden"></p>
        <div id="l1msg" class="hint"></div>
        <div id="l1stats" class="stats"></div>
        <button class="ask" data-q="q1" data-t="ask"></button>
        <button data-theatre="l1" data-t="watch_again"></button>
        <button id="l1next" class="next" data-t="next" disabled></button>
      </div>
    </div>
  </section>

  <section id="l2" class="screen">
    <div class="row">
      <canvas id="c2" width="320" height="320"></canvas>
      <div class="panel wide">
        <p class="hint" data-t="l2_hint"></p>
        <div class="knob"><img id="dial" src="assets/ui/curiosity_dial.png" alt="curiosity dial">
          <input id="eps" type="range" min="0" max="100" value="30"></div>
        <div id="epsLabel" class="stats"></div>
        <label><input type="checkbox" id="trail" checked> <span data-t="l2_trail"></span></label>
        <button id="l2train" class="big" data-t="train"></button>
        <div id="l2stats" class="stats"></div>
        <button class="ask" data-q="q2" data-t="ask"></button>
        <button data-theatre="l2" data-t="watch_again"></button>
        <button id="l2next" class="next" data-t="next" disabled></button>
      </div>
    </div>
  </section>

  <section id="l3" class="screen">
    <div class="row">
      <canvas id="c3" width="320" height="320"></canvas>
      <div class="panel wide">
        <p class="hint" data-t="l3_rate"></p>
        <div id="rate"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></div>
        <div id="confBars"></div>
        <div id="l3stats" class="stats"></div>
        <div id="l3result" class="hint big"></div>
        <p class="small" data-t="l3_note"></p>
        <button class="ask" data-q="q3" data-t="ask"></button>
        <button data-theatre="l3" data-t="watch_again"></button>
        <button id="l3next" class="next" data-t="next" disabled></button>
      </div>
    </div>
  </section>

  <section id="l4" class="screen">
    <div class="toolbar">
      <button id="l4start" class="big" data-t="l4_start"></button>
      <span class="hint" data-t="keys"></span>
      <button data-fs="l4wrap">⛶</button>
      <button id="l4next" class="next" data-t="next" disabled></button>
    </div>
    <div id="l4wrap" class="kwrap">
      <canvas id="c4k" class="kcanvas" width="1280" height="720" tabindex="0"></canvas>
      <div id="endScreen" class="hidden">
        <canvas id="endCanvas" class="kcanvas" width="1280" height="720"></canvas>
        <button id="again" class="big" data-t="again"></button>
      </div>
      <div id="dingoRef" aria-label="Dingo, referee"><div class="bubble hidden"></div><canvas id="dingoRefCv" width="215" height="220" aria-label="Dingo"></canvas><span class="tag">Dingo</span></div>
    </div>
  </section>

  <section id="final" class="screen">
    <!-- recap teaching: one lesson per level from data/recap_lessons.json, then Dingo's wrap-up, then the trainer report -->
    <div id="recap">
      <div class="recapHead"><span id="recapStep"></span><h2 id="recapTitle"></h2><span id="recapTeacher"></span></div>
      <div class="recapBody">
        <div class="recapStage">
          <div class="recapCast">
            <figure data-who="dingo"><canvas id="recapDingo" width="358" height="410" aria-label="Dingo"></canvas><figcaption>Dingo</figcaption></figure>
            <figure data-who="wendy"><canvas id="recapWendy" width="174" height="256" aria-label="Wendy"></canvas><figcaption>Wendy</figcaption></figure>
            <figure data-who="kai"><canvas id="recapKai" width="219" height="256" aria-label="Kai"></canvas><figcaption>Kai</figcaption></figure>
          </div>
          <div id="recapVideoSlot"></div>
        </div>
        <!-- knowledge card: text from data/recap_lessons.json (lessons[].card, summary_card) -->
        <div class="recapBoard recapCard panel">
          <span class="draftTag hidden" id="kcDraft"></span>
          <div class="kcTerm"><b id="kcTermMain"></b><span id="kcTermAlt"></span></div>
          <p id="kcDef"></p>
          <p id="kcKitchenRow"><span class="kcLabel" data-t="in_kitchen"></span> <span id="kcKitchen"></span></p>
          <ul id="kcBullets"></ul>
          <div id="kcSummary" class="hidden"></div>
          <div id="recapIllus" class="hidden"></div>
          <div id="recapVisual"></div>
          <p id="recapCallout" class="hidden"></p><ul id="recapTerms" class="hidden"></ul>
        </div>
      </div>
      <div class="recapSay"><b id="recapWho"></b><p id="recapLine"></p><button id="recapNext" class="next big" data-t="next"></button></div>
    </div>
    <!-- certificate: art/recap/certificate.png + certificate_layout.json boxes; text in data/certificate.json -->
    <div id="certificate" class="hidden">
      <div id="certBox"></div>
      <div class="certBar"><span class="draftTag hidden" id="certDraft"></span><button id="certDownload" data-t="cert_download"></button><button id="certPrint" data-t="cert_print"></button><button id="certNext" class="next big" data-t="next"></button></div>
    </div>
    <div id="finalReport" class="hidden">
    <h2 data-t="final_title"></h2>
    <table id="finalTable"></table>
    <div class="cards">
      <img src="assets/cards/knowledge_card_1_v2.png" alt="Reward"><img src="assets/cards/knowledge_card_2_v2.png" alt="Exploring">
      <img src="assets/cards/knowledge_card_4_v2.png" alt="Is it sure?"><img src="assets/cards/knowledge_card_3_v2.png" alt="Team value">
    </div>
    <button data-go="team" data-t="team_name"></button>
    <button data-go="menu" data-t="nav_menu"></button>
    </div>
  </section>

  <section id="team" class="screen">
    <div class="row">
      <canvas id="c4" width="320" height="320"></canvas>
      <div class="panel" id="teamPanel"></div>
    </div>
  </section>
</main>

<div id="overlay" class="hidden">
  <div class="popup">
    <img id="owl" alt="owl">
    <div>
      <h3 id="popTitle"></h3>
      <p id="popBody"></p>
      <div id="popChoices"></div>
      <p id="popFeedback" class="hint"></p>
      <button id="popClose" data-t="ok"></button>
    </div>
  </div>
</div>
<div id="theatre" class="hidden">
  <video id="theatreVideo" playsinline muted preload="auto"></video>
  <button id="theatreStart" class="hidden" data-t="start_opening"></button>
  <button id="theatreSkip" data-t="skip"></button>
</div>
<div id="subtitle" class="hidden"></div>
<div id="sceneVideo" class="hidden"><video id="sceneVid" playsinline preload="auto"></video><div id="sceneSub"></div><button id="vidNext" class="next big" data-t="next" onclick="event.stopPropagation(); Voice.vidNext()"></button></div>
<!-- Dingo's welcome dialogue (RPG box, typewriter, name entry) -->
<div id="dialog" class="hidden home-bg" onclick="Story.click()">
  <div class="dlgStage"><canvas id="dlgDingo" width="358" height="410" aria-label="Dingo"></canvas></div>
  <div class="dlgBox"><b class="dlgName">Dingo</b><p id="dlgText"></p>
    <div id="dlgNameRow" class="hidden" onclick="event.stopPropagation()"><label for="dlgName" data-t="your_name"></label>
      <input id="dlgName" maxlength="16" autocomplete="off"><button id="dlgNameOk" class="btn-primary" data-t="ok"></button></div>
    <button id="dlgNext" class="next" data-t="next" onclick="event.stopPropagation(); Story.click()"></button></div>
</div>
<!-- level bridge: Dingo + line + Next, then the roadmap animation -->
<div id="bridge" class="hidden">
  <div id="bridgeMap"></div>
  <div class="bridgeCard"><canvas id="bridgeDingo" width="358" height="410" aria-label="Dingo"></canvas>
    <div class="bridgeBubble"><p id="bridgeText"></p><button id="bridgeNext" class="next big" data-t="next"></button></div></div>
</div>
<div id="guideLayer"></div>
<div id="guideBubble" class="hidden"><img alt=""><div><b></b> <span></span></div></div>
<script src="i18n.js"></script>
<script src="fx.js"></script>
<script src="kai.js"></script>
<script src="character.js"></script>
<script src="guide.js"></script>
<script src="story.js"></script>
<script src="game.js"></script>
</body>
</html>
